name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: graftail-linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: graftail-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: graftail-darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: graftail-darwin-arm64
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            name: graftail-win-x64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation dependencies
        if: contains(matrix.target, 'windows')
        run: sudo apt-get install -y mingw-w64

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ startsWith(matrix.name, 'graftail-win') && 'graftail.exe' || 'graftail' }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List artifacts
        run: find dist -type f -exec ls -lh {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
